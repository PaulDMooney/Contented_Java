name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Files after checkout
        run: ls -la
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
            java-version: '25'
            distribution: 'zulu'
            cache: 'maven'
            check-latest: true
      - name: Build and Test
        run: mvn --batch-mode verify
      - name: Generate test reports
        if: always()
        run: mvn --batch-mode surefire-report:report-only surefire-report:failsafe-report-only
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/reports