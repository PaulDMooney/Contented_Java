# Trace/span ids in logs come from Spring Boot's built-in correlation pattern,
# applied automatically because micrometer-tracing is on the classpath.
elasticsearch:
  index:
    name: "contentitemindex"
    mappingsfile: "elasticsearch/mappings.json"

spring:
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: contented
    password: example
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  elasticsearch:
    uris: localhost:9200

